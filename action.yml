name: Sign Windows Files
description: Windows action which signs specified files using powershell
author: acornbytes

branding:
  icon: "lock"
  color: "purple"

inputs:
  cert_base64:
    description: The Base64-encoded representation of the PFX certificate.
    required: false
  cert_path:
    description: The path to the PFX certificate file. Takes priority over cert_base64
    required: false
  cert_password:
    description: Password for the certificate, if required.
    required: false
  folder:
    description: Change to folder before sign files, globs relative to the folder
    required: false
    default: ".\"
  recursive:
    description: 'Recursively search for supported files.'
    type: boolean
    required: false
    default: false
  sign_globs:
    description: Paths (globs) of the files to sign (comma-separated)
    required: true
    default: '*.exe,*.dll'
  hash:
    description: File digest algorithm (e.g., SHA256)
    required: false
    default: SHA256
  timestamp_server:
    description: "Timestamp server URL"
    required: false

#    default: 'http://timestamp.sectigo.com'

runs:
  using: "composite"
  steps:
    - name: print inputs (1)
      shell: pwsh
      run: |
        $folder           = "${{ inputs.folder           }}"
        $recursive        = "${{ inputs.recursive        }}"
        $hash             = "${{ inputs.hash             }}"
        $timestamp_server = "${{ inputs.timestamp_server }}"
        Write-Host "folder           = $folder"
        Write-Host "hash             = $hash"
        Write-Host "recursive        = $recursive"
        Write-Host "timestamp_server = $timestamp_server"

    - name: Import PowerShell Module Microsoft.PowerShell.Security
      shell: pwsh
      run: |
        Import-Module -Name 'Microsoft.PowerShell.Security' -Verbose

    - name: Sign Files
      shell: pwsh
      run: |
        $folder           = "${{ inputs.folder           }}"
        $recursive        = "${{ inputs.recursive        }}"
        $hash             = "${{ inputs.hash             }}"
        $timestamp_server = "${{ inputs.timestamp_server }}"
        
        $certificatePath = "${{ inputs.cert_path }}"
        if($certificatePath) {
          Write-Host "Using certificate file: '$certificatePath'"
          $certificateExists = Test-Path -Path $certificatePath
          if (!$certificateExists) {
            throw "Specified certificate file '$certificatePath' does not exist."
          }
        } else {
          No certificate file provided, using base64 certificate data."
          $certBase64 = "${{ inputs.cert_base64 }}"
          if(!$certBase64) {
            throw "No certificate data provided."
          }
          $certBytes = [System.Convert]::FromBase64String($certBase64)
          $certificatePath = Join-Path $env:RUNNER_TEMP 'code-signing-certificate.pfx'
          [System.IO.File]::WriteAllBytes($certificatePath, $certBytes)
        }
        Write-Host "Using certificate '$certificatePath' for binary signing"

        if($folder) {
          $folderExists = Test-Path -Path $folder
          if (!$folderExists) {
            throw "Specified folder '$folder' does not exist."
          } else {
            Set-Location -Path $folder
            Write-Host "'$folder' found"
            $currentFolder = Get-Location
            Write-Host "current folder: '$currentFolder'"
          }
        }

        $pathGlobs = '${{ inputs.sign_globs }}' -Split ','
        $pathGlobsCount = $pathGlobs.Count
        Write-Host "'$pathGlobsCount' total glob paths to process"

        if($pathGlobsCount -eq 0) {
          throw "No paths found"
        }

        $signCertificate = Get-PfxCertificate -FilePath $certificatePath -Password (ConvertTo-SecureString -String ${{ inputs.cert_password }} -AsPlainText -Force)

        foreach ($pathGlob in $pathGlobsCount) {
          Write-Host "Found: '$pathGlob'"
          if($recursive) {
            $foundPaths = Get-ChildItem -Path "$pathGlob" -Verbose -Recurse
            Write-Host "path: '$foundPaths'"
          } else {
            $foundPaths = Get-ChildItem -Path "$pathGlob" -Verbose
            Write-Host "path: '$foundPaths'"
          }
          $foundPathsCount = $foundPaths.Count
          foreach($foundPath in $foundPaths) {
            Set-AuthenticodeSignature -Certificate $signCertificate -FilePath $($foundPath.FullName) -IncludeChain All -TimestampServer $timestamp_server -HashAlgorithm $hash -Force -Verbose
          }
        }
